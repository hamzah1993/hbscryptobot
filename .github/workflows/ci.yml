name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbstrading
          POSTGRES_USER: hbs
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hbs -d hbstrading"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://hbs:ci_password@localhost:5432/hbstrading?schema=public
      JWT_SECRET: ci_secret_key_for_build_only
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  production-stack:
    name: Production stack smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production environment file
        run: |
          cp deploy/.env.production.example deploy/.env.production
          sed -i \
            -e 's/^DOMAIN=.*/DOMAIN=localhost/' \
            -e 's|^FRONTEND_URL=.*|FRONTEND_URL=https://localhost|' \
            -e 's|^CORS_ORIGINS=.*|CORS_ORIGINS=https://localhost|' \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
            -e "s|^EXCHANGE_CREDENTIALS_KEY=.*|EXCHANGE_CREDENTIALS_KEY=$(openssl rand -base64 32)|" \
            deploy/.env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml config --quiet

      - name: Build and start the production stack
        run: docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build --wait --wait-timeout 300

      - name: Validate the Caddy configuration
        run: docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml exec -T web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Smoke test the web app and API over HTTPS
        run: |
          curl -fsSk https://localhost/api/health | grep '"status":"ok"'
          curl -fsSk https://localhost/ | grep -i '<div id="root"'
          curl -fsSk https://localhost/some/client/route | grep -i '<div id="root"'
          curl -fsSkI https://localhost/api/health | grep -i 'x-content-type-options: nosniff'

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml logs --tail=200

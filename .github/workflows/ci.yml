name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "test/**"
      - "chore/**"
  pull_request:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbstrading
          POSTGRES_USER: hbs
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hbs -d hbstrading"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://hbs:ci_password@localhost:5432/hbstrading?schema=public
      JWT_SECRET: ci_secret_key_for_build_only
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

name: Update project checklist

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: project-checklist-main
  cancel-in-progress: false

jobs:
  record-merge:
    name: Record merged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record merge in project checklist
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 .github/scripts/update_project_checklist.py \
            --number "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --author "$PR_AUTHOR" \
            --merged-at "$PR_MERGED_AT" \
            --sha "$PR_MERGE_SHA"

      - name: Commit checklist update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- docs/project-checklist.md; then
            echo "Checklist already contains PR #$PR_NUMBER."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-checklist.md
          git commit -m "docs: record merged PR #$PR_NUMBER in project checklist"
          git push origin HEAD:main
